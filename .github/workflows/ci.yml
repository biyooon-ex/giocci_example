name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIX_ENV: test
      ZENOHD_CONNECT_ENDPOINTS: ${{ vars.ZENOHD_CONNECT_ENDPOINTS || secrets.ZENOHD_CONNECT_ENDPOINTS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.3'
          elixir-version: '1.19.5'

      - name: Validate Zenoh endpoint configuration
        run: |
          if [ -z "$ZENOHD_CONNECT_ENDPOINTS" ]; then
            echo "ZENOHD_CONNECT_ENDPOINTS is not configured. Set it as a repository or environment variable, or as a secret."
            exit 1
          fi

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: Run tests
        run: mix test